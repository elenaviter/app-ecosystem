[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project-board"
version = "2026.09.22.2100"
description = "The Project Board client: the pb command a machine runs to join a board, receive addressed work, and report on it, with the shared contract both sides speak."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Elena Viter" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 1 - Planning",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/elenaviter/app-ecosystem"
Repository = "https://github.com/elenaviter/app-ecosystem"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
project_board = ["py.typed"]
