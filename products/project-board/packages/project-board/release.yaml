package:
  id: project-board
  ref: "2026.09.27.2142"
  description: |
    Problem Board client set 2026.09.27.2142: a new machine is connected with the endpoint alone.

    - `pb setup` reads the tenant and platform project from the endpoint, so the board's "Connect a machine" endpoint is the only address a person gives. A tenant or project given as well must agree, and a non-board endpoint is refused with the expected shape, both before anything is written (W304).
    - "Connect a machine" is in the board's top bar and needs no project. README, first-run and `pb setup`'s endpoint hint say where to find it (W304).
    - The worker's tmux step runs as copied after one `ALIAS=<name>@<machine>` line (W304).
    - The optional knowledge role and its hand-over are public (W340).
    - Procedure revision 2026.09.27.10.

components:
  python_package:
    id: project-board
    path: products/project-board/packages/project-board
    version: "2026.09.27.2142"
