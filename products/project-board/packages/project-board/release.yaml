package:
  id: project-board
  ref: "2026.10.19.2200"
  description: |
    - Connection Hub Card lock: the Redis eviction-policy check reads `maxmemory_policy` from `INFO memory` when `CONFIG GET` is refused or answers without the policy, as on Redis services that restrict `CONFIG` (AWS ElastiCache). A policy that `CONFIG` reports is never overridden; when neither source reports one the lock still refuses as unverified, and any policy other than `noeviction` is still refused (#861).

