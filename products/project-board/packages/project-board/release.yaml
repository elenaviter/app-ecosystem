package:
  id: project-board
  ref: "2026.09.28.0307"
  description: |
    Problem Board client set 2026.09.28.0307: editing a project file from the board.

    - The coordinator's relay applies an edit made on the project card: in a separate worktree, refused if the file changed since it was opened, committed in the coordinator's project identity, then pushed as a pull request or directly, per the repository's setting. The card shows the outcome. A machine accepts edits only after its owner runs `pb host configure --add-control-kind project.file.edit` (W370).
    - Editing from the card also needs a platform rebuild with this release's package; until then the board lists it as waiting.
    - Procedure revision 2026.09.28.3.

components:
  python_package:
    id: project-board
    path: products/project-board/packages/project-board
    version: "2026.09.28.0307"
