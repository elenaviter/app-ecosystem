<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 770" font-family="Inter, ui-sans-serif, system-ui, sans-serif" role="img" aria-labelledby="pbtitle pbdesc">
  <title id="pbtitle">How Problem Board ties together</title>
  <desc id="pbdesc">A KDCube deployment holds the Problem Board app, with its plan, mail, assignments, reviews and journal views in PostgreSQL, and Connection Hub, which holds the Cards: the project Control Card, each agent's Card, and each person's Control Card and My Card. A person uses the board in a browser and approves Cards in Connection Hub with a device link and code. A Telegram bot relays project messages and files both ways. On each machine, one pb relay per operating-system user keeps each agent's channel to the board under that agent's own Card. Each agent is a Claude Code or Codex session under its own provider account. Credentials stay in the machine's native password store, never inside the agent. Each agent's workspace holds the clean clones, work worktrees, a journal worktree and review trees. The clones reach GitHub over SSH with one deploy key per repository; today these keys are made per operating-system user, and the direction is keys minted per project through Connection Hub.</desc>
