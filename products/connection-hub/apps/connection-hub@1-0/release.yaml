bundle:
  repo: "https://github.com/elenaviter/app-ecosystem.git"
  ref: "2026.09.02.1410"
  description: |
    Release 2026.09.02.1410 for connection-hub@1-0.

    Highlights

    - Adds provider-console OAuth clients for MCP providers that support neither
      Client ID Metadata Documents nor dynamic client registration.
    - Shows the exact callback URI and accepts the provider client id, optional
      secret, and configured token-endpoint authentication method.
    - Keeps provider client secrets and OAuth tokens in owner-scoped server-side
      secret storage and out of Redux, descriptors, cards, responses, and tool
      results.
    - Reuses a provisioned client on Reconnect and provides an explicit client
      replacement path without changing the connector resource.
    - Shows the exact governed Streamable HTTP endpoint with a newly issued
      caller bearer and documents the complete KDCube-backed localhost path.

    Validation

    - Connection Hub package suite: 180 passed.
    - Connection Hub app suite: 53 passed.
    - KDCube remote-MCP suite: 17 passed.
    - KDCube CLI descriptor suite: 139 passed.
    - KDCube bundle contract suite: 301 passed and 50 graph-only contracts
      skipped.
    - Connections widget: 20 tests passed and the production build completed.
    - Six maintained descriptor forms passed structured semantic comparison.
    - Provisioned-client, dynamic-registration, and Client ID Metadata OAuth
      acceptance passed against a refreshed local KDCube runtime, including
      refresh, governed invocation, reconnect, upstream revocation, deletion,
      cleanup, and a tested-credential log scan.
