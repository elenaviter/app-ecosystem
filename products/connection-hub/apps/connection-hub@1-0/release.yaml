bundle:
  repo: "https://github.com/elenaviter/app-ecosystem.git"
  ref: "2026.09.02.0515"
  description: |
    Release 2026.09.02.0515 for connection-hub@1-0.

    Highlights

    - Adds browser authorization for owner-configured OAuth-protected external
      MCP servers, including PKCE, Client ID Metadata Documents, dynamic client
      registration, single-use state, refresh rotation, and revocation.
    - Keeps upstream OAuth credentials in the owner's secret store. Connector,
      card, browser, and proxy responses contain only non-secret metadata.
    - Reconnects OAuth in place, preserving the connector resource while
      revoking the replaced provider grant. Deletion revokes the current grant.
    - Adds OAuth and Reconnect controls to the External MCP panel, with a
      popup-safe authorization launch and visible fallback link.
    - Preserves exact delegated tool filtering, Once and Always invocation
      policy, descriptor drift review, and the connector-wide kill switch.

    Validation

    - Connection Hub package suite: 178 passed.
    - Connection Hub app suite: 52 passed.
    - KDCube remote-MCP suite: 13 passed.
    - KDCube bundle contract suite: 300 passed and 50 graph-only contracts
      skipped.
    - Connections widget: 19 tests passed and the production build completed.
    - Live direct-credential proxy, direct service admission, dynamic client
      registration OAuth, and Client ID Metadata OAuth acceptance all passed
      against a refreshed local KDCube runtime.
