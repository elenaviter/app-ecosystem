openapi: 3.1.0
info:
  title: Connection Hub App Interface
  version: 0.3.0
  description: |
    Interface contract for connection-hub@1-0.

    The app exposes:
    - connection-edge operations for resolving verified external identities to
      platform principal envelopes;
    - request-authenticator operation for verifying provider/request proofs
      through Connection Hub authenticator modules and returning linked authority
      material;
    - a `named_service` operation that serves the whole `connections`
      named-service contract over HTTP;
    - thin authenticated operations for the Connections settings widget
      (catalog, start OAuth, disconnect) and for iCloud app-password settings;
    - one public browser OAuth callback route shared across connection providers/apps;
    - one optional direct protected-service admission route that combines an
      opaque delegated bearer with an independently signed service request;
    - owner-scoped external MCP connector operations and one delegated MCP
      proxy that injects the owner-held upstream credential server-side;
    - once-or-always invocation policy for exact delegated operations;
    - one `connections_settings` widget built from `ui/widgets/connections`.

    Every POST operation body is wrapped as `{ "data": { ... } }` by frontend
    callers. KDCube responses are platform-wrapped; unwrap the property named by
    the operation alias.
x-kdcube-surfaces:
  widgets:
    connections_settings:
      source_folder: ui/widgets/connections
      decorator: "@ui_widget"
      config_key: ui.widgets.connections_settings
servers:
  - url: /api/integrations
tags:
  - name: Widgets
  - name: Connection Edges
  - name: Identity
  - name: Authenticators
  - name: Named Services
  - name: Connections
  - name: Email
  - name: OAuth Callbacks
  - name: Delegated Admission
  - name: Delegated Access
  - name: External MCP
security:
  - PlatformAuth: []
paths:
  /bundles/{tenant}/{project}/{bundle_id}/widgets/connections_settings:
    get:
      tags: [Widgets]
      summary: Serve the authenticated Connections settings widget.
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/BundleId"
      responses:
        "200":
          description: HTML Connections settings widget app.
          content:
            text/html:
              schema:
                type: string

  /bundles/{tenant}/{project}/{bundle_id}/operations/named_service:
    post:
      tags: [Named Services]
      summary: Dispatch a `connections` named-service request.
      description: >
        Serves the whole `connections` contract: provider about/capabilities,
        object list/get/action/resolve, connection.get_token, start/disconnect.
        Reached locally by other apps via discovery (bundle_registry
        transport) and over HTTP here. Tokens are user-scoped.
      operationId: named_service
      x-kdcube-result-alias: named_service
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/BundleId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NamedServiceRequestEnvelope"
      responses:
        "200":
          description: Named-service response envelope.

  /bundles/{tenant}/{project}/{bundle_id}/operations/connection_edges_list:
    get:
      tags: [Connection Edges]
      summary: List connection edges for the current platform user.
      operationId: connection_edges_list
      x-kdcube-result-alias: connection_edges_list
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/BundleId"
      responses:
        "200":
          description: Connection edges for the current platform user.

  /bundles/{tenant}/{project}/{bundle_id}/operations/connection_edge_upsert:
    post:
      tags: [Connection Edges]
      summary: Write a verified external-identity edge to the current platform user.
      description: User-facing route. Does not grant roles.
      operationId: connection_edge_upsert
      x-kdcube-result-alias: connection_edge_upsert
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/BundleId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionEdgeRequestEnvelope"
      responses:
        "200":
          description: Connection edge and platform principal envelope.

  /bundles/{tenant}/{project}/{bundle_id}/operations/connection_edge_remove:
    post:
      tags: [Connection Edges]
      summary: Remove an external connection edge from the current platform user.
      operationId: connection_edge_remove
      x-kdcube-result-alias: connection_edge_remove
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/BundleId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionEdgeRefRequestEnvelope"
      responses:
        "200":
          description: Remove result.

  /bundles/{tenant}/{project}/{bundle_id}/operations/connection_edge_challenge_create:
    post:
      tags: [Connection Edges]
      summary: Create a one-time proof challenge for writing a connection edge.
      description: >
        Authenticated route. Stores the current platform user server-side on the
        challenge. The provider proof flow must complete it later.
      operationId: connection_edge_challenge_create
      x-kdcube-result-alias: connection_edge_challenge_create
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/BundleId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionEdgeChallengeCreateEnvelope"
      responses:
        "200":
          description: Pending challenge and optional Telegram Mini App link.

  /bundles/{tenant}/{project}/{bundle_id}/operations/connection_edge_challenge_claim:
    post:
      tags: [Connection Edges]
      summary: Claim a provider-first proof as the current platform user.
      description: >
        Authenticated route. Used by Telegram-first flows after the Telegram Mini
        App has created a signed pending provider proof and the browser claim
        page has shown an explicit confirmation. The current platform session
        becomes the platform_user_id on the final connection edge. Calls without
        data.confirmed=true are rejected.
      operationId: connection_edge_challenge_claim
      x-kdcube-result-alias: connection_edge_challenge_claim
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/BundleId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionEdgeChallengeStatusEnvelope"
      responses:
        "200":
          description: Claimed challenge, connection edge, and principal envelope.

  /bundles/{tenant}/{project}/{bundle_id}/operations/connection_edge_challenge_status:
    post:
      tags: [Connection Edges]
      summary: Read a one-time proof challenge without claiming it.
      description: >
        Authenticated route. Platform-first challenges are limited to their
        platform user. Provider-first pending challenges have no platform owner
        yet, so the currently signed-in platform user may preview the Telegram
        identity before confirming a claim.
      operationId: connection_edge_challenge_status
      x-kdcube-result-alias: connection_edge_challenge_status
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/BundleId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionEdgeChallengeStatusEnvelope"
      responses:
        "200":
          description: Challenge status and connection edge if completed.

  /bundles/{tenant}/{project}/{bundle_id}/operations/identity_resolve:
    post:
      tags: [Identity]
      summary: Resolve a verified external identity to a platform principal envelope.
      description: >
        The caller must validate the external proof before calling this route.
        Role resolution belongs to the platform principal/role resolver; the
        configured mode is only a local fixture.
      operationId: identity_resolve
      x-kdcube-result-alias: identity_resolve
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/BundleId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExternalIdentityRefRequestEnvelope"
      responses:
        "200":
          description: Platform principal envelope or identity_not_linked.

  /bundles/{tenant}/{project}/{bundle_id}/operations/identity_family_resolve:
    post:
      tags: [Identity]
      summary: Resolve the linked identity family for the current actor.
      description: >
        Authenticated route. Returns the platform authority identity and linked
        provider/integration identities for the same person. This is the
        Connection Hub Resolver facet used by consumers such as memories to
        aggregate records across actor user ids without trusting client-supplied
        user-id lists.
      operationId: identity_family_resolve
      x-kdcube-result-alias: identity_family_resolve
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/BundleId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IdentityFamilyRequestEnvelope"
      responses:
        "200":
          description: Linked identity family with canonical user ids for aggregation.

  /bundles/{tenant}/{project}/{bundle_id}/operations/delegated_identity_scope_resolve:
    post:
      tags: [Identity]
      summary: Resolve the data-owner scope for a delegated credential.
      description: >
        Internal/server-side helper for already verified delegated credentials.
        Returns the grantor and any linked runtime user ids allowed by the
        credential's descriptor-owned identity_scope.
      operationId: delegated_identity_scope_resolve
      x-kdcube-result-alias: delegated_identity_scope_resolve
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/BundleId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DelegatedIdentityScopeRequestEnvelope"
      responses:
        "200":
          description: Delegation edge plus canonical user ids for aggregation.

  /bundles/{tenant}/{project}/{bundle_id}/operations/delegated_access_map:
    get:
      tags: [Delegated Access]
      summary: Read-only map of delegated resources, namespaces, and grants.
      description: >
        Admin route. Resolves the live connections configuration into the
        named-services-to-grants mapping: the grant vocabulary
        (delegated_credentials.oauth.capabilities), each OAuth resource with
        its tools and named-service namespaces and their per-operation grants
        (delegated_credentials.oauth.resources), and the provider-backed
        connected-account claim vocabulary (delegated_to_kdcube.providers).
        Secret values and secret refs are never returned.
      operationId: delegated_access_map
      x-kdcube-result-alias: delegated_access_map
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/BundleId"
      responses:
        "200":
          description: Resolved grants, resources, namespaces, and providers.

  /bundles/{tenant}/{project}/{bundle_id}/operations/delegated_invocation_policy_set:
    post:
      tags: [Delegated Access]
      summary: Set once-or-always policy for one granted card operation.
      operationId: delegated_invocation_policy_set
      x-kdcube-result-alias: delegated_invocation_policy_set
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/BundleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DelegatedInvocationPolicyEnvelope"
      responses:
        "200":
          description: Current invocation policy, or a structured owner/card/operation conflict.

  /bundles/{tenant}/{project}/{bundle_id}/operations/remote_mcp_connectors_list:
    get:
      tags: [External MCP]
      summary: List the signed-in user's external MCP connectors without secret values.
      operationId: remote_mcp_connectors_list
      x-kdcube-result-alias: remote_mcp_connectors_list
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/BundleId"
      responses:
        "200":
          description: Owner-scoped connector revisions and accepted or pending descriptor metadata.

  /bundles/{tenant}/{project}/{bundle_id}/operations/remote_mcp_connector_create:
    post:
      tags: [External MCP]
      summary: Validate, discover, and create one owner-scoped external MCP connector.
      operationId: remote_mcp_connector_create
      x-kdcube-result-alias: remote_mcp_connector_create
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/BundleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoteMCPConnectorCreateEnvelope"
      responses:
        "200":
          description: Created connector. The submitted credential value is never returned.

  /bundles/{tenant}/{project}/{bundle_id}/operations/remote_mcp_connector_refresh:
    post:
      tags: [External MCP]
      summary: Rediscover an external MCP connector and record descriptor drift.
      operationId: remote_mcp_connector_refresh
      x-kdcube-result-alias: remote_mcp_connector_refresh
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/BundleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoteMCPConnectorRevisionEnvelope"
      responses:
        "200":
          description: New connector revision with accepted or pending descriptor state.

  /bundles/{tenant}/{project}/{bundle_id}/operations/remote_mcp_connector_start_oauth:
    post:
      tags: [External MCP]
      summary: Discover upstream OAuth and start owner authorization for an external MCP connector.
      operationId: remote_mcp_connector_start_oauth
      x-kdcube-result-alias: remote_mcp_connector_start_oauth
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/BundleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoteMCPOAuthStartEnvelope"
      responses:
        "200":
          description: Browser authorization URL and an opaque state digest; no OAuth credential is returned.

  /bundles/{tenant}/{project}/{bundle_id}/public/remote_mcp_oauth_callback:
    get:
      tags: [External MCP]
      summary: Consume the upstream OAuth callback and create the owner connector.
      operationId: remote_mcp_oauth_callback
      security: []
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/BundleId"
        - name: code
          in: query
          schema: { type: string }
        - name: state
          in: query
          required: true
          schema: { type: string }
        - name: error
          in: query
          schema: { type: string }
        - name: iss
          in: query
          schema: { type: string, format: uri }
      responses:
        "200":
          description: Human completion page; token and dynamic-client material remain server-side.

  /bundles/{tenant}/{project}/{bundle_id}/public/remote_mcp_oauth_client_metadata:
    get:
      tags: [External MCP]
      summary: Publish this Connection Hub deployment's OAuth client metadata document.
      operationId: remote_mcp_oauth_client_metadata
      security: []
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/BundleId"
      responses:
        "200":
          description: OAuth client metadata for authorization servers that support URL-based client IDs.
          content:
            application/json:
              schema:
                type: object
                required: [redirect_uris, token_endpoint_auth_method]
                properties:
                  client_name: { type: string }
                  redirect_uris:
                    type: array
                    items: { type: string, format: uri }
                  response_types:
                    type: array
                    items: { type: string }
                  grant_types:
                    type: array
                    items: { type: string }
                  token_endpoint_auth_method: { type: string, const: none }
                  application_type: { type: string, const: web }

  /bundles/{tenant}/{project}/{bundle_id}/operations/remote_mcp_connector_accept_descriptor:
    post:
      tags: [External MCP]
      summary: Accept the pending discovered descriptor under an optimistic revision.
      operationId: remote_mcp_connector_accept_descriptor
      x-kdcube-result-alias: remote_mcp_connector_accept_descriptor
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/BundleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoteMCPConnectorRevisionEnvelope"
      responses:
        "200":
          description: Connector with the accepted descriptor revision.

  /bundles/{tenant}/{project}/{bundle_id}/operations/remote_mcp_connector_set_enabled:
    post:
      tags: [External MCP]
      summary: Enable or disable one owner-scoped external MCP connector.
      operationId: remote_mcp_connector_set_enabled
      x-kdcube-result-alias: remote_mcp_connector_set_enabled
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/BundleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoteMCPConnectorEnabledEnvelope"
      responses:
        "200":
          description: Updated connector state and revision.

  /bundles/{tenant}/{project}/{bundle_id}/operations/remote_mcp_connector_update_credential:
    post:
      tags: [External MCP]
      summary: Replace the server-side upstream credential and rediscover tools.
      operationId: remote_mcp_connector_update_credential
      x-kdcube-result-alias: remote_mcp_connector_update_credential
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/BundleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoteMCPCredentialEnvelope"
      responses:
        "200":
          description: Updated connector. The submitted credential value is never returned.

  /bundles/{tenant}/{project}/{bundle_id}/operations/remote_mcp_connector_delete:
    post:
      tags: [External MCP]
      summary: Delete one owner-scoped connector and its upstream credential.
      operationId: remote_mcp_connector_delete
      x-kdcube-result-alias: remote_mcp_connector_delete
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/BundleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RemoteMCPConnectorRevisionEnvelope"
      responses:
        "200":
          description: Deleted connector revision; the secret is removed.

  /bundles/{tenant}/{project}/{bundle_id}/operations/authenticators_list:
    get:
      tags: [Authenticators]
      summary: List configured Connection Hub authenticator rows.
      description: >
        Admin/maintenance route. Returns configured request-authenticator module
        rows such as Telegram bots and whether their referenced secrets are
        configured. Secret values are never returned.
      operationId: authenticators_list
      x-kdcube-result-alias: authenticators_list
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/BundleId"
      responses:
        "200":
          description: Configured authenticator rows with secret-reference status.

  /bundles/{tenant}/{project}/{bundle_id}/operations/authenticators_upsert:
    post:
      tags: [Authenticators]
      summary: Create or update a request-authenticator metadata row.
      description: >
        Stores metadata only in Postgres. Pass `secret_ref` to point at a
        bundle secret; do not pass secret values. Fields such as
        `secret_value`, `bot_token`, `client_secret`, `signing_secret`, and
        `api_key` are rejected.
      operationId: authenticators_upsert
      x-kdcube-result-alias: authenticators_upsert
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/BundleId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthenticatorUpsertEnvelope"
      responses:
        "200":
          description: Saved metadata row or validation error.

  /bundles/{tenant}/{project}/{bundle_id}/operations/authenticators_remove:
    post:
      tags: [Authenticators]
      summary: Soft-delete a Postgres-backed authenticator metadata row.
      description: Descriptor-defined rows are immutable through this API.
      operationId: authenticators_remove
      x-kdcube-result-alias: authenticators_remove
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/BundleId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthenticatorRemoveEnvelope"
      responses:
        "200":
          description: Soft-delete result.

  /bundles/{tenant}/{project}/{bundle_id}/operations/dcr_allowlist_get:
    get:
      tags: [Authenticators]
      summary: Read the OAuth dynamic-client-registration redirect allowlist.
      description: >
        Admin route. Returns the configured
        `connections.delegated_credentials.oauth.dynamic_client_registration.allowed_redirect_uris`
        list, the built-in defaults, and the effective list (defaults apply when
        the configured list is empty). DCR runs before any user authenticates,
        so this allowlist is what keeps a registered client's redirect pointed
        at a known app callback or loopback only.
      operationId: dcr_allowlist_get
      x-kdcube-result-alias: dcr_allowlist_get
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/BundleId"
      responses:
        "200":
          description: Configured, effective, and default DCR redirect URIs.

  /bundles/{tenant}/{project}/{bundle_id}/operations/dcr_allowlist_set:
    post:
      tags: [Authenticators]
      summary: Replace the OAuth dynamic-client-registration redirect allowlist.
      description: >
        Admin route. Replaces `allowed_redirect_uris` in the bundle props.
        Every entry must be an absolute URI; `http` is accepted for loopback
        hosts only (RFC 8252 — loopback entries match any port at enforcement
        time). An empty list falls back to the built-in defaults.
      operationId: dcr_allowlist_set
      x-kdcube-result-alias: dcr_allowlist_set
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/BundleId"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    allowed_redirect_uris:
                      type: array
                      items:
                        type: string
      responses:
        "200":
          description: Saved allowlist or validation error.

  /bundles/{tenant}/{project}/{bundle_id}/operations/connections_catalog:
    get:
      tags: [Connections]
      summary: List providers → client apps → user accounts.
      operationId: connections_catalog
      x-kdcube-result-alias: connections_catalog
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/BundleId"
      responses:
        "200":
          description: Connection catalog with connected/configured flags.

  /bundles/{tenant}/{project}/{bundle_id}/operations/connections_start_oauth:
    post:
      tags: [Connections]
      summary: Begin OAuth for a provider/client-app.
      operationId: connections_start_oauth
      x-kdcube-result-alias: connections_start_oauth
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/BundleId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartOAuthRequestEnvelope"
      responses:
        "200":
          description: Authorize URL and OAuth state.

  /bundles/{tenant}/{project}/{bundle_id}/operations/connections_disconnect:
    post:
      tags: [Connections]
      summary: Disconnect a connected user account.
      operationId: connections_disconnect
      x-kdcube-result-alias: connections_disconnect
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/BundleId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisconnectRequestEnvelope"
      responses:
        "200":
          description: Disconnect result.

  /bundles/{tenant}/{project}/{bundle_id}/operations/email_accounts_status:
    get:
      tags: [Email]
      summary: Read iCloud account status (email integration is iCloud-only; Gmail is a connections provider).
      operationId: email_accounts_status
      x-kdcube-result-alias: email_accounts_status
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/BundleId"
      responses:
        "200":
          description: Email (iCloud) account status.

  /bundles/{tenant}/{project}/{bundle_id}/operations/email_connect_app_password:
    post:
      tags: [Email]
      summary: Connect an app-password email account (iCloud).
      operationId: email_connect_app_password
      x-kdcube-result-alias: email_connect_app_password
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/BundleId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailAppPasswordRequestEnvelope"
      responses:
        "200":
          description: Connected email account.

  /bundles/{tenant}/{project}/{bundle_id}/operations/email_disconnect_account:
    post:
      tags: [Email]
      summary: Disconnect an email account.
      operationId: email_disconnect_account
      x-kdcube-result-alias: email_disconnect_account
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/BundleId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailDisconnectRequestEnvelope"
      responses:
        "200":
          description: Disconnect result.

  /bundles/{tenant}/{project}/{bundle_id}/operations/connections_settings:
    get:
      tags: [Widgets]
      summary: Thin widget data alias for the Connections settings widget.
      operationId: connections_settings
      x-kdcube-result-alias: connections_settings
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/BundleId"
      responses:
        "200":
          description: Widget data.

  /bundles/{tenant}/{project}/{bundle_id}/public/connection_oauth_callback:
    get:
      tags: [OAuth Callbacks]
      summary: Shared OAuth callback for all connection providers/apps.
      description: >
        Browser redirect target. Validates `state` with
        `connections.oauth_state_secret`, exchanges `code`, and stores a
        user-scoped token. Register this exact path as the redirect URI in each
        provider's OAuth app.
      operationId: connection_oauth_callback
      security: []
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/BundleId"
        - $ref: "#/components/parameters/OAuthCode"
        - $ref: "#/components/parameters/OAuthState"
        - $ref: "#/components/parameters/OAuthError"
      responses:
        "200":
          description: HTML redirect/result page.
          content:
            text/html:
              schema:
                type: string

  /bundles/{tenant}/{project}/{bundle_id}/public/telegram_connection_edge_start:
    post:
      tags: [Connection Edges]
      summary: Start a Telegram-first connection-edge flow.
      description: >
        Public Telegram Mini App route. The request must include signed Telegram
        initData in `X-Telegram-Init-Data`. It creates a pending provider proof
        and returns a platform_claim_url that the user opens to finish as a
        logged-in KDCube platform user.
      operationId: telegram_connection_edge_start
      security: []
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/BundleId"
        - name: X-Telegram-Init-Data
          in: header
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Envelope"
      responses:
        "200":
          description: Pending Telegram proof and platform claim URL.

  /bundles/{tenant}/{project}/{bundle_id}/public/telegram_connection_edge_status:
    get:
      tags: [Connection Edges]
      summary: Read Telegram edge status for the current Mini App subject.
      description: >
        Public Telegram Mini App route. The request must include signed Telegram
        initData in `X-Telegram-Init-Data`. Returns whether that Telegram
        subject has a connection edge to a platform user.
      operationId: telegram_connection_edge_status
      security: []
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/BundleId"
        - name: X-Telegram-Init-Data
          in: header
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Telegram edge status and principal envelope when connected.

  /bundles/{tenant}/{project}/{bundle_id}/public/telegram_connection_edge_remove:
    post:
      tags: [Connection Edges]
      summary: Remove the current Telegram Mini App subject's connection edge.
      description: >
        Public Telegram Mini App route. The request must include signed Telegram
        initData in `X-Telegram-Init-Data`. Removes the edge for that Telegram
        subject when one exists.
      operationId: telegram_connection_edge_remove
      security: []
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/BundleId"
        - name: X-Telegram-Init-Data
          in: header
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Envelope"
      responses:
        "200":
          description: Connection-edge removal result.

  /bundles/{tenant}/{project}/{bundle_id}/public/telegram_connection_edge_complete:
    post:
      tags: [Connection Edges]
      summary: Complete a Telegram connection-edge challenge.
      description: >
        Public Telegram Mini App route. The request must include signed Telegram
        initData in `X-Telegram-Init-Data`; the platform user is read from the
        server-side challenge, not from caller input.
      operationId: telegram_connection_edge_complete
      security: []
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/BundleId"
        - name: X-Telegram-Init-Data
          in: header
          required: true
          schema: { type: string }
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConnectionEdgeChallengeStatusEnvelope"
      responses:
        "200":
          description: Connected Telegram identity and platform principal envelope.

  /bundles/{tenant}/{project}/{bundle_id}/public/federated_data_bus_claim:
    post:
      tags: [Authenticators]
      summary: Claim a Connection Hub live-channel token for an authenticated external subject.
      description: >
        Public route used by embedded Connection Hub widgets. The request is
        authenticated through the same promoted request auth context as other
        public Telegram routes. On success it returns a short-lived federated
        Socket.IO token scoped to connection-hub@1-0 so the widget can receive
        targeted service events such as connection_hub.edge.changed.
      operationId: federated_data_bus_claim
      security: []
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/BundleId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Envelope"
      responses:
        "200":
          description: Federated Socket.IO token claim.

  /bundles/{tenant}/{project}/{bundle_id}/public/request_authenticate:
    post:
      tags: [Authenticators]
      summary: Authenticate a request envelope through Connection Hub authenticators.
      description: >
        Gateway/app selector route. The caller sends a normalized request
        envelope. Connection Hub selects authenticator candidates from request
        hints and shape, verifies the proof with its configured authenticator rows,
        resolves the connection edge, and returns linked authority material.
      operationId: request_authenticate
      security: []
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/BundleId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestAuthenticateEnvelope"
      responses:
        "200":
          description: Authenticated actor plus linked platform authority, or a declined result.

  /bundles/{tenant}/{project}/{bundle_id}/public/mcp/remote_mcp_proxy:
    post:
      tags: [External MCP]
      summary: List or call exact external MCP tools selected on the caller's live card.
      description: |
        Streamable-HTTP MCP JSON-RPC endpoint. Connection Hub resolves the
        delegated bearer to its exact current card, intersects the owner-scoped
        connector and accepted live tool descriptor, applies invocation policy,
        injects the upstream credential server-side, and dispatches the remote
        tool. A caller can provide `connection_hub/invocation_id` in MCP call
        metadata for stable retry and result replay.
      operationId: remote_mcp_proxy
      security:
        - DelegatedBearer: []
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/BundleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: MCP JSON-RPC result, including structured delegated denial when the tool cannot run.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /bundles/{tenant}/{project}/{bundle_id}/public/delegated_admission:
    post:
      tags: [Delegated Admission]
      summary: Evaluate one external protected-service operation against current delegated authority.
      description: |
        Authenticates the protected service independently from the delegated
        bearer, rejects replay, then resolves the bearer through its current
        delegated card and the current active capability catalog. The service
        registration binds the workload to resource selectors; it does not
        duplicate operations or grants.

        The signature is base64url HMAC-SHA256 over the canonical
        `connection-hub-admission-v1` message documented in the Connection Hub
        architecture. The body itself is not wrapped in `data`.
      operationId: delegated_admission
      security:
        - DelegatedBearer: []
          ConnectionHubServiceId: []
          ConnectionHubTimestamp: []
          ConnectionHubNonce: []
          ConnectionHubSignature: []
      parameters:
        - $ref: "#/components/parameters/Tenant"
        - $ref: "#/components/parameters/Project"
        - $ref: "#/components/parameters/BundleId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DelegatedAdmissionRequest"
      responses:
        "200":
          description: The registered service may perform the concrete operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DelegatedAdmissionAllow"
        "400":
          description: The semantic request is incomplete or malformed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DelegatedAdmissionDenial"
        "401":
          description: The service proof or delegated bearer is invalid.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DelegatedAdmissionDenial"
        "403":
          description: The service, card, catalog, operation, grant, or account scope denies the request.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DelegatedAdmissionDenial"
        "409":
          description: The signed service request nonce was already used.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DelegatedAdmissionDenial"
        "503":
          description: A required authority, secret, projection, or replay store is unavailable; the request fails closed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DelegatedAdmissionDenial"
components:
  securitySchemes:
    PlatformAuth:
      type: apiKey
      in: cookie
      name: __Secure-LATC
    DelegatedBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque-kst1
      description: Opaque delegated-client bearer issued through Connection Hub.
    ConnectionHubServiceId:
      type: apiKey
      in: header
      name: X-Connection-Hub-Service-Id
      description: Descriptor-registered protected-service id.
    ConnectionHubTimestamp:
      type: apiKey
      in: header
      name: X-Connection-Hub-Timestamp
      description: Decimal Unix timestamp covered by the service signature.
    ConnectionHubNonce:
      type: apiKey
      in: header
      name: X-Connection-Hub-Nonce
      description: Single-use 16-256 character replay nonce covered by the service signature.
    ConnectionHubSignature:
      type: apiKey
      in: header
      name: X-Connection-Hub-Signature
      description: Base64url-without-padding HMAC-SHA256 service request signature.
  parameters:
    Tenant:
      name: tenant
      in: path
      required: true
      schema: { type: string }
      example: demo-tenant
    Project:
      name: project
      in: path
      required: true
      schema: { type: string }
      example: demo-project
    BundleId:
      name: bundle_id
      in: path
      required: true
      schema: { type: string }
      example: connection-hub@1-0
    OAuthCode:
      name: code
      in: query
      required: false
      schema: { type: string }
    OAuthState:
      name: state
      in: query
      required: false
      schema: { type: string }
    OAuthError:
      name: error
      in: query
      required: false
      schema: { type: string }
  schemas:
    DelegatedInvocationPolicyEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              additionalProperties: false
              required: [access_id, resource, operation, mode, expected_revision]
              properties:
                access_id: { type: string }
                resource: { type: string }
                operation: { type: string }
                mode: { type: string, enum: [once, always] }
                expected_revision: { type: integer, minimum: 0 }
                account:
                  type: object
                  additionalProperties: false
                  properties:
                    provider_id: { type: string }
                    account_id: { type: string }
    RemoteMCPConnectorCreateEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              additionalProperties: false
              required: [label, endpoint, credential_mode]
              properties:
                label: { type: string, maxLength: 160 }
                endpoint: { type: string, format: uri, maxLength: 2048 }
                credential_mode: { type: string, enum: [none, bearer, header] }
                credential_header:
                  type: string
                  description: Required only for header mode; forbidden transport headers are rejected.
                credential_value:
                  type: string
                  writeOnly: true
                  maxLength: 16384
                  description: Required for bearer or header mode and stored only in the owner secret store.
    RemoteMCPConnectorRevisionEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              additionalProperties: false
              required: [connector_id, expected_revision]
              properties:
                connector_id: { type: string, pattern: '^mcp_[a-z0-9]{24}$' }
                expected_revision: { type: integer, minimum: 1 }
    RemoteMCPOAuthStartEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              additionalProperties: false
              required: [label, endpoint]
              properties:
                label: { type: string, maxLength: 160 }
                endpoint: { type: string, format: uri, maxLength: 2048 }
                return_hint:
                  type: string
                  format: uri
                  description: Same-origin Connection Hub page to offer after authorization.
                connector_id:
                  type: string
                  pattern: '^mcp_[a-z0-9]{24}$'
                  description: Existing owner connector to reauthorize in place.
                expected_revision:
                  type: integer
                  minimum: 0
                  description: Required current revision when connector_id is present.
                oauth_client_mode:
                  type: string
                  enum: [automatic, provisioned]
                  description: Automatic client registration or a client created in the provider console.
                oauth_client:
                  type: object
                  additionalProperties: false
                  required: [client_id, token_endpoint_auth_method]
                  description: Provider-console client used only when oauth_client_mode is provisioned.
                  properties:
                    client_id:
                      type: string
                      maxLength: 4096
                    client_secret:
                      type: string
                      writeOnly: true
                      maxLength: 65536
                    token_endpoint_auth_method:
                      type: string
                      enum: [none, client_secret_basic, client_secret_post]
    RemoteMCPConnectorEnabledEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              additionalProperties: false
              required: [connector_id, expected_revision, enabled]
              properties:
                connector_id: { type: string, pattern: '^mcp_[a-z0-9]{24}$' }
                expected_revision: { type: integer, minimum: 1 }
                enabled: { type: boolean }
    RemoteMCPCredentialEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              additionalProperties: false
              required: [connector_id, expected_revision, credential_mode]
              properties:
                connector_id: { type: string, pattern: '^mcp_[a-z0-9]{24}$' }
                expected_revision: { type: integer, minimum: 1 }
                credential_mode: { type: string, enum: [none, bearer, header] }
                credential_header: { type: string }
                credential_value:
                  type: string
                  writeOnly: true
                  maxLength: 16384
    DelegatedAdmissionRequest:
      type: object
      additionalProperties: false
      required: [resource, operation]
      properties:
        resource:
          type: string
          format: uri
          description: Canonical protected resource already present in the active delegated capability catalog.
          example: https://api.example.test/customers
        operation:
          type: string
          description: Concrete operation published for the resource in the active catalog.
          example: customers.search
        invocation_id:
          type: string
          maxLength: 256
          description: Stable provider-domain invocation id; supplied together with request_digest.
        request_digest:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: Canonical SHA-256 digest of the provider-domain request; supplied together with invocation_id.
        account:
          $ref: "#/components/schemas/DelegatedAdmissionAccount"
    DelegatedAdmissionAccount:
      type: object
      additionalProperties: false
      required: [provider_id, account_id]
      properties:
        provider_id:
          type: string
          example: salesforce
        account_id:
          type: string
          example: account-17
        claims:
          type: array
          uniqueItems: true
          items: { type: string }
          example: [contacts:read]
    DelegatedAdmissionAllow:
      type: object
      additionalProperties: false
      required: [ok, allowed, schema, decision_id, service_id, principal, authority, provenance, expires_at]
      properties:
        ok: { type: boolean, const: true }
        allowed: { type: boolean, const: true }
        schema: { type: string, const: connection_hub.delegated_admission.v1 }
        decision_id: { type: string }
        service_id: { type: string }
        principal:
          type: object
          additionalProperties: false
          required: [sub, client_id]
          properties:
            sub:
              type: string
              description: Pairwise subject scoped to this registered service; not the internal platform user id.
            client_id:
              type: string
              description: Pairwise caller-profile id scoped to this service and user; not the raw Connection Hub client or card id.
        authority:
          type: object
          additionalProperties: false
          required: [resource, operation, grants]
          properties:
            resource: { type: string, format: uri }
            operation: { type: string }
            grants:
              type: array
              items: { type: string }
            account_scope:
              $ref: "#/components/schemas/DelegatedAdmissionAccount"
        provenance:
          type: object
          additionalProperties: false
          required: [card_revision, card_catalog_version, active_catalog_version]
          properties:
            card_revision: { type: integer, minimum: 0 }
            card_catalog_version: { type: string }
            active_catalog_version: { type: string }
            invocation_policy_revision: { type: integer, minimum: 1 }
        expires_at:
          type: integer
          minimum: 0
          description: Delegated bearer/card expiry as a Unix timestamp.
        invocation_id: { type: string }
        replay: { type: boolean }
        invocation_policy:
          type: object
          additionalProperties: false
          properties:
            mode: { type: string, enum: [once, always] }
            revision: { type: integer, minimum: 1 }
            state: { type: string, enum: [available, consumed] }
            remaining:
              oneOf:
                - type: integer
                  minimum: 0
                - type: 'null'
            updated_at: { type: integer, minimum: 0 }
    DelegatedAdmissionDenial:
      type: object
      required: [ok, allowed, schema, error, ret]
      properties:
        ok: { type: boolean, const: false }
        allowed: { type: boolean, const: false }
        schema: { type: string, const: connection_hub.delegated_admission.v1 }
        error:
          type: object
          required: [code, message, where, retryable]
          properties:
            code: { type: string }
            message: { type: string }
            where: { type: string, const: connection_hub.delegated_admission }
            retryable: { type: boolean }
        ret:
          type: object
          required: [reason]
          properties:
            reason: { type: string }
            decision_id: { type: string }
            details:
              type: object
              additionalProperties: true
    Envelope:
      type: object
      properties:
        data:
          type: object
          additionalProperties: true
      required: [data]
    NamedServiceRequestEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/NamedServiceRequest"
    RequestAuthenticateEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              properties:
                request:
                  $ref: "#/components/schemas/RequestEnvelope"
              required: [request]
    RequestEnvelope:
      type: object
      required: [method, path]
      properties:
        method:
          type: string
          example: POST
        path:
          type: string
          example: /api/integrations/bundles/demo-tenant/demo-project/user-memories/public/widgets/memories
        url:
          type: string
        headers:
          type: object
          additionalProperties:
            type: string
          example:
            x-telegram-init-data: "<Telegram.WebApp.initData>"
            x-kdcube-auth-provider: "telegram"
            x-kdcube-auth-integration-id: "telegram.default"
        query:
          type: object
          additionalProperties: true
        cookies:
          type: object
          additionalProperties:
            type: string
        body_text:
          type: string
        body_base64:
          type: string
    AuthenticatorUpsertEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/AuthenticatorUpsertRequest"
    AuthenticatorUpsertRequest:
      type: object
      required: [provider]
      properties:
        id:
          type: string
          description: Preferred stable authenticator id.
          example: telegram.support.init_data
        authenticator_id:
          type: string
          description: Stable verifier row id.
          example: telegram.support.init_data
        authority_id:
          type: string
          description: Identity/grant realm this authenticator belongs to.
          example: telegram.support
        provider:
          type: string
          example: telegram
        label:
          type: string
        enabled:
          type: boolean
          default: true
        role_providing:
          type: boolean
          default: false
          description: True only for authenticators that directly establish platform authority; linked external providers normally keep this false.
        subject_namespace:
          type: string
          example: telegram
        secret_ref:
          type: string
          description: Bundle-secret path. The secret value is stored in bundles.secrets.yaml or the configured bundle secrets provider.
          example: identity.authenticators.telegram_support.bot_token
        selector:
          type: object
          additionalProperties: true
          description: Provider-owned routing hints. Not a secret store.
        verifier:
          type: object
          additionalProperties: true
          description: Provider-owned verification hints. Not a secret store.
        properties:
          type: object
          additionalProperties: true
          description: Non-secret provider metadata such as bot username or display hints.
    AuthenticatorRemoveEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              required: [authenticator_id]
              properties:
                authenticator_id:
                  type: string
    NamedServiceRequest:
      type: object
      required: [operation]
      properties:
        operation:
          type: string
          example: connection.get_token
        namespace:
          type: string
          example: connections
        object_ref:
          type: string
        action:
          type: string
        payload:
          type: object
          additionalProperties: true
          example: { "provider": "slack" }
    ExternalIdentityRefRequestEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/ExternalIdentityRefRequest"
    IdentityFamilyRequestEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              properties:
                input_user_id:
                  type: string
                  description: Optional actor/platform user id to resolve. Defaults to the current authenticated actor.
                actor_user_id:
                  type: string
                  description: Alias used by server-side callers when they already know the actor user id.
                target_user_id:
                  type: string
                  description: Alias for input_user_id.
                user_id:
                  type: string
                  description: Alias for input_user_id in generic clients.
    DelegatedIdentityScopeRequestEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              required: [credential]
              properties:
                credential:
                  type: object
                  additionalProperties: true
                  description: Verified kdcube.credential.v1 envelope from the delegated access token grant record.
    ConnectionEdgeRefRequestEnvelope:
