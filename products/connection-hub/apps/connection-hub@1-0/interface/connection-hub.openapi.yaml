                  default: telegram
    ConnectionEdgeChallengeStatusEnvelope:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: object
              required: [challenge_id]
              properties:
                challenge_id:
                  type: string
                confirmed:
                  type: boolean
