[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "connection-hub"
version = "2026.09.26.2205"
description = "Connection Hub delegated-access authority and client SDK."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Elena Viter" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "aiohttp>=3.9,<4",
    "cryptography>=49,<51",
    "httpx>=0.27,<1",
    "jwcrypto>=1.5.6,<2",
]

[project.optional-dependencies]
# The server-side-login OIDC authenticator verifies ID tokens through PyJWT when a
# host does not inject its own verifier.
oidc = [
    "PyJWT[crypto]>=2.8,<3",
]
# The caller side (connection_hub.caller): sign-in, profiles and credentials in
# the native store, and an authenticated MCP connection. Problem Board's pb
# depends on this extra and needs no KDCube package (W322).
client = [
    "app-foundation[mcp,native-secrets]>=2026.09.26.2205,<2027",
    "filelock>=3.16,<4",
    "httpx2>=2.5,<3",
    "keyring>=25,<26",
    "mcp==2.0.0",
    "platformdirs>=4,<5",
]
test = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.23,<2",
]

[project.urls]
Homepage = "https://github.com/elenaviter/app-ecosystem"
Repository = "https://github.com/elenaviter/app-ecosystem"
Documentation = "https://github.com/elenaviter/app-ecosystem/tree/main/docs/connection-hub"
Issues = "https://github.com/elenaviter/app-ecosystem/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
connection_hub = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
