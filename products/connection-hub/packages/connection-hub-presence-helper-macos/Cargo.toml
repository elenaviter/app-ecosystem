[package]
name = "connection-hub-presence-helper-macos"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
publish = false
autobins = false

[features]
interactive-check = []

[lib]
name = "connection_hub_presence_helper"
path = "src/lib.rs"

[[bin]]
name = "connection-hub-presence-helper"
path = "src/bin/helper.rs"

[[bin]]
name = "connection-hub-presence-interactive-check"
path = "src/bin/interactive_check.rs"
required-features = ["interactive-check"]

[dependencies]
base64 = "=0.22.1"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
core-foundation = "=0.10.0"
core-foundation-sys = "=0.8.7"
libc = "=0.2.189"
percent-encoding = "=2.3.2"
rand = "=0.9.5"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "native-tls"] }
security-framework = { version = "=3.0.1", features = ["OSX_10_15"] }
security-framework-sys = { version = "=2.12.1", default-features = false, features = ["OSX_10_15"] }
serde = { version = "=1.0.216", features = ["derive"] }
serde_json = "=1.0.133"
sha2 = "=0.10.8"
url = "=2.5.8"
uuid = { version = "=1.11.0", features = ["serde", "v4"] }
zeroize = "=1.8.1"

[dev-dependencies]
tempfile = "=3.14.0"

[profile.release]
codegen-units = 1
lto = true
strip = "symbols"
