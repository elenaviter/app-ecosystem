product:
  id: connection-hub
  ref: "2026.09.27.1507"
  description: |
    Problem Board client set 2026.09.27.1507.

    - Each agent's commit identity comes from the project. `pb worker context` returns it as `<agent alias> <project email>`, `pb worker workspace-report --set-identity` applies it repository-local, and the report flags clones that differ (W368).
    - The project-board README explains what gets installed: four packages at one version, with `connection-hub[client]` holding Card authority and credentials. It also shows an architecture diagram of how machines, relays, agents, workspaces, Cards, KDCube, GitHub and Telegram tie together (W361).
    - The release procedure is written in neutral roles (W364).
    - Procedure revision 2026.09.27.7.
  documentation: docs/connection-hub

components:
  kdcube_app:
    id: connection-hub@1-0
    path: products/connection-hub/apps/connection-hub@1-0
    release_record: products/connection-hub/apps/connection-hub@1-0/release.yaml
  python_package:
    distribution: connection-hub
    import_name: connection_hub
    path: products/connection-hub/packages/connection-hub
    version: "2026.09.27.1507"
    version_source: products/connection-hub/packages/connection-hub/pyproject.toml
    workflow: .github/workflows/publish-python-package.yml
  cli_package:
    distribution: connection-hub-cli
    import_name: connection_hub_cli
    path: products/connection-hub/packages/connection-hub-cli
    version: "2026.09.27.1507"
    version_source: products/connection-hub/packages/connection-hub-cli/pyproject.toml
    workflow: .github/workflows/publish-python-package.yml

config:
  version: "2026.09.27.1507"
