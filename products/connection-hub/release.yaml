product:
  id: connection-hub
  ref: "2026.09.02.0515"
  description: |
    Owners can connect an external OAuth-protected MCP without giving OAuth
    tokens to a delegated caller. Connection Hub performs protected-resource
    and authorization-server discovery, chooses a Client ID Metadata Document
    or dynamic client registration, completes PKCE authorization, stores the
    resulting credential in the owner's secret store, and refreshes it under a
    connector-scoped lock.

    Reauthorization preserves the connector resource and existing delegated
    card authority while revoking the replaced upstream grant. Connector
    deletion revokes current access and refresh tokens before removing the
    local secret. The hosted app adds browser start, callback, public client
    metadata, Reconnect, and exact-origin return handling. Direct bearer and
    header connectors retain their established transport contract.
  documentation: docs/connection-hub

components:
  kdcube_app:
    id: connection-hub@1-0
    path: products/connection-hub/apps/connection-hub@1-0
    release_record: products/connection-hub/apps/connection-hub@1-0/release.yaml
  python_package:
    distribution: connection-hub
    import_name: connection_hub
    path: products/connection-hub/packages/connection-hub
    version: "2026.09.02.0515"
    version_source: products/connection-hub/packages/connection-hub/pyproject.toml
    workflow: .github/workflows/publish-python-package.yml

config:
  version: "2026.09.02.0515"
