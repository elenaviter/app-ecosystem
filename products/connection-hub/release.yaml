product:
  id: connection-hub
  ref: "2026.09.27.1727"
  description: |
    Problem Board client set 2026.09.27.1727: a new machine can be set up by its own agent.

    - `pb status` checks the machine's prerequisites for its OS (Linux: python and venv, git, tmux, linger, the systemd user manager, a usable keyring; macOS: python, git, tmux, keychain). It names each missing one with the exact fix, says whether it needs an administrator, and says what works without it (W304).
    - `pb setup` checks that the endpoint answers as the board before it writes anything, and refuses with a named reason (W304).
    - `pb procedure install` records which pb installed the skill, so the agent finds it wherever it lives (W304).
    - The skill's first-run and the README follow one agent-guided path. Install pb and the skill, start the agent as the worker in tmux, and give it the values from the board's new "Connect a machine" panel; it sets up the machine, proposes the newest release and enrolls, and you approve its Card with --device (W304).
    - Procedure revision 2026.09.27.8.
  documentation: docs/connection-hub

components:
  kdcube_app:
    id: connection-hub@1-0
    path: products/connection-hub/apps/connection-hub@1-0
    release_record: products/connection-hub/apps/connection-hub@1-0/release.yaml
  python_package:
    distribution: connection-hub
    import_name: connection_hub
    path: products/connection-hub/packages/connection-hub
    version: "2026.09.27.1727"
    version_source: products/connection-hub/packages/connection-hub/pyproject.toml
    workflow: .github/workflows/publish-python-package.yml
  cli_package:
    distribution: connection-hub-cli
    import_name: connection_hub_cli
    path: products/connection-hub/packages/connection-hub-cli
    version: "2026.09.27.1727"
    version_source: products/connection-hub/packages/connection-hub-cli/pyproject.toml
    workflow: .github/workflows/publish-python-package.yml

config:
  version: "2026.09.27.1727"
