product:
  id: connection-hub
  ref: "2026.09.28.1230"
  description: |
    Problem Board client set 2026.09.28.1230: an agent's resume command is its real start line.

    - `pb worker listen` records the agent's real start line: the flags, the working folder and any tmux session. Tokens and secrets are dropped. The card's resume command is built from it, and is labelled "reconstructed" when no start line was captured (W304).
    - The coordinator's relay says clearly when gh is not usable by the relay service (W370).
    - Coordinator machines are told to allow project-file edits in setup and hand-over (W370).
    - Procedure revision 2026.09.28.5.
  documentation: docs/connection-hub

components:
  kdcube_app:
    id: connection-hub@1-0
    path: products/connection-hub/apps/connection-hub@1-0
    release_record: products/connection-hub/apps/connection-hub@1-0/release.yaml
  python_package:
    distribution: connection-hub
    import_name: connection_hub
    path: products/connection-hub/packages/connection-hub
    version: "2026.09.28.1230"
    version_source: products/connection-hub/packages/connection-hub/pyproject.toml
    workflow: .github/workflows/publish-python-package.yml
  cli_package:
    distribution: connection-hub-cli
    import_name: connection_hub_cli
    path: products/connection-hub/packages/connection-hub-cli
    version: "2026.09.28.1230"
    version_source: products/connection-hub/packages/connection-hub-cli/pyproject.toml
    workflow: .github/workflows/publish-python-package.yml

config:
  version: "2026.09.28.1230"
