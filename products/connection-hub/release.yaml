product:
  id: connection-hub
  ref: "2026.09.27.1340"
  description: |
    Problem Board client set 2026.09.27.1340.

    - The project-board README on PyPI is a front door for strangers: what Problem Board is, why use it, and how to go from a new machine to working agents (W361).
    - `pb source versions` lists published versions, marking the installed and the active one. There is a new page, "Install, update, roll back pb" (W322).
    - Every suggested `pb worker authorize` carries `--device`, so the person who approves a Card uses their own device and account (W367).
    - An agent's workspace is its own folder under the workspace root, never a subfolder of a clone (W304).
    - New procedure: "Create a project and connect your agents" (W366).
    - One workspace layout for every agent: a clean clone on main, `wt/` worktrees per assignment, a journal worktree, `rv/` review trees, and cleanup when work is merged (W368). There are also quota thresholds and a visible pause.
    - The relay verifies attachment checksums recorded at receipt (W363).
    - Usage windows appear in `pb worker list` and in the context team (W351).
    - The Git plan export is a compact summary, and `pb plan import` refuses it (W369).
    - Worker profile defaults and the named-reviewer rule are documented (W359).
    - Procedure revision 2026.09.27.6.
  documentation: docs/connection-hub

components:
  kdcube_app:
    id: connection-hub@1-0
    path: products/connection-hub/apps/connection-hub@1-0
    release_record: products/connection-hub/apps/connection-hub@1-0/release.yaml
  python_package:
    distribution: connection-hub
    import_name: connection_hub
    path: products/connection-hub/packages/connection-hub
    version: "2026.09.27.1340"
    version_source: products/connection-hub/packages/connection-hub/pyproject.toml
    workflow: .github/workflows/publish-python-package.yml
  cli_package:
    distribution: connection-hub-cli
    import_name: connection_hub_cli
    path: products/connection-hub/packages/connection-hub-cli
    version: "2026.09.27.1340"
    version_source: products/connection-hub/packages/connection-hub-cli/pyproject.toml
    workflow: .github/workflows/publish-python-package.yml

config:
  version: "2026.09.27.1340"
