product:
  id: connection-hub
  ref: "2026.10.18.1804"
  description: |
    - KDCube profiles: one host can serve more than one KDCube. Every host command takes `--profile <name>`, and a session takes `PB_PROFILE` from its environment. A command picks its deployment by `--config`, `--profile`, `PROBLEM_BOARD_CONFIG`, `PB_PROFILE`, then the machine default. An unknown or ambiguous profile is refused, never answered with the default. A profile whose configuration no longer exists is also refused (`work_profile_config_missing`). `pb status` and `pb worker context` show the profile in use and what chose it.
    - Setup keeps the machine default: setting up another profile no longer moves the machine default. `pb setup --make-default` moves it explicitly.
    - Worker procedure: the managed procedure is at revision 2026.10.18.2. The pages that name a Card authorization profile show `pb worker authorize <profile> --device`.
  documentation: docs/connection-hub

components:
  kdcube_app:
    id: connection-hub@1-0
    path: products/connection-hub/apps/connection-hub@1-0
    release_record: products/connection-hub/apps/connection-hub@1-0/release.yaml
  python_package:
    distribution: connection-hub
    import_name: connection_hub
    path: products/connection-hub/packages/connection-hub
    version: "2026.10.18.1804"
    version_source: products/connection-hub/packages/connection-hub/pyproject.toml
    workflow: .github/workflows/publish-python-package.yml
  cli_package:
    distribution: connection-hub-cli
    import_name: connection_hub_cli
    path: products/connection-hub/packages/connection-hub-cli
    version: "2026.10.18.1804"
    version_source: products/connection-hub/packages/connection-hub-cli/pyproject.toml
    workflow: .github/workflows/publish-python-package.yml

config:
  version: "2026.10.18.1804"
