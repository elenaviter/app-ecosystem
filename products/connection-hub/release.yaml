product:
  id: connection-hub
  ref: "2026.10.03.0407"
  description: |
    - Data Bus client: a socket that goes silent is replaced at once instead of waiting for the transport to notice, and a retired socket's transport and HTTP session are released even when the release fails or is cancelled.
    - Host relay: a channel whose transport is only reconnecting keeps its session, so a call in flight across a short drop keeps its outcome and its idempotency, instead of the channel being replaced after a long backoff.
    - Reconnects log how long the transport open and the credential resolve took.
    - A relay timing test no longer depends on how quickly a response arrives.
  documentation: docs/connection-hub

components:
  kdcube_app:
    id: connection-hub@1-0
    path: products/connection-hub/apps/connection-hub@1-0
    release_record: products/connection-hub/apps/connection-hub@1-0/release.yaml
  python_package:
    distribution: connection-hub
    import_name: connection_hub
    path: products/connection-hub/packages/connection-hub
    version: "2026.10.03.0407"
    version_source: products/connection-hub/packages/connection-hub/pyproject.toml
    workflow: .github/workflows/publish-python-package.yml
  cli_package:
    distribution: connection-hub-cli
    import_name: connection_hub_cli
    path: products/connection-hub/packages/connection-hub-cli
    version: "2026.10.03.0407"
    version_source: products/connection-hub/packages/connection-hub-cli/pyproject.toml
    workflow: .github/workflows/publish-python-package.yml

config:
  version: "2026.10.03.0407"
