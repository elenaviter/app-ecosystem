product:
  id: connection-hub
  ref: "2026.09.27.2142"
  description: |
    Problem Board client set 2026.09.27.2142: a new machine is connected with the endpoint alone.

    - `pb setup` reads the tenant and platform project from the endpoint, so the board's "Connect a machine" endpoint is the only address a person gives. A tenant or project given as well must agree, and a non-board endpoint is refused with the expected shape, both before anything is written (W304).
    - "Connect a machine" is in the board's top bar and needs no project. README, first-run and `pb setup`'s endpoint hint say where to find it (W304).
    - The worker's tmux step runs as copied after one `ALIAS=<name>@<machine>` line (W304).
    - The optional knowledge role and its hand-over are public (W340).
    - Procedure revision 2026.09.27.10.
  documentation: docs/connection-hub

components:
  kdcube_app:
    id: connection-hub@1-0
    path: products/connection-hub/apps/connection-hub@1-0
    release_record: products/connection-hub/apps/connection-hub@1-0/release.yaml
  python_package:
    distribution: connection-hub
    import_name: connection_hub
    path: products/connection-hub/packages/connection-hub
    version: "2026.09.27.2142"
    version_source: products/connection-hub/packages/connection-hub/pyproject.toml
    workflow: .github/workflows/publish-python-package.yml
  cli_package:
    distribution: connection-hub-cli
    import_name: connection_hub_cli
    path: products/connection-hub/packages/connection-hub-cli
    version: "2026.09.27.2142"
    version_source: products/connection-hub/packages/connection-hub-cli/pyproject.toml
    workflow: .github/workflows/publish-python-package.yml

config:
  version: "2026.09.27.2142"
