product:
  id: connection-hub
  ref: "2026.10.03.0215"
  description: |
    - Agent mail can carry files through the board: `pb worker send --attach`, `pb worker attachment-read` under the held lease, and forwarding with the attachments and the original message as provenance. Executable binaries are refused; use Git for those.
    - Host relay: two workspace-size walks run at once, so one long walk no longer holds back the other agents.
    - Host relay event loop: the workspace walk runs once per interval in a child process. Git and coordinate reads, control materialization, registration, the coordinate queue, outbox lock waits, session wake store calls and local-work scans all run off the loop. Local-work scans run in one scanner thread and never pile up.
    - Connection Hub: OAuth clients are reused under a connection cap and closed cleanly. Every OAuth request carries a request id, and lock, custody and refresh spans are logged redacted.
    - Connection Hub: removing or disconnecting a profile takes its credential lock.
    - Connection Hub: an unanswered OAuth discovery is reported as transient, and a running reconnect is shown.
    - `pb worker receive` can select by correlation, and operator mail keeps its priority.
    - Worker procedure revision 2026.10.02.6 (from 2026.10.01.2): the two-field handoff workflow, the batch roles table and coordination corrections, a coordinator that reconciles the work and integrates promptly, and agent mail attachments.
  documentation: docs/connection-hub

components:
  kdcube_app:
    id: connection-hub@1-0
    path: products/connection-hub/apps/connection-hub@1-0
    release_record: products/connection-hub/apps/connection-hub@1-0/release.yaml
  python_package:
    distribution: connection-hub
    import_name: connection_hub
    path: products/connection-hub/packages/connection-hub
    version: "2026.10.03.0215"
    version_source: products/connection-hub/packages/connection-hub/pyproject.toml
    workflow: .github/workflows/publish-python-package.yml
  cli_package:
    distribution: connection-hub-cli
    import_name: connection_hub_cli
    path: products/connection-hub/packages/connection-hub-cli
    version: "2026.10.03.0215"
    version_source: products/connection-hub/packages/connection-hub-cli/pyproject.toml
    workflow: .github/workflows/publish-python-package.yml

config:
  version: "2026.10.03.0215"
