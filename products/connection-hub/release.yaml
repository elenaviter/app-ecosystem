product:
  id: connection-hub
  ref: "2026.09.28.0307"
  description: |
    Problem Board client set 2026.09.28.0307: editing a project file from the board.

    - The coordinator's relay applies an edit made on the project card: in a separate worktree, refused if the file changed since it was opened, committed in the coordinator's project identity, then pushed as a pull request or directly, per the repository's setting. The card shows the outcome. A machine accepts edits only after its owner runs `pb host configure --add-control-kind project.file.edit` (W370).
    - Editing from the card also needs a platform rebuild with this release's package; until then the board lists it as waiting.
    - Procedure revision 2026.09.28.3.
  documentation: docs/connection-hub

components:
  kdcube_app:
    id: connection-hub@1-0
    path: products/connection-hub/apps/connection-hub@1-0
    release_record: products/connection-hub/apps/connection-hub@1-0/release.yaml
  python_package:
    distribution: connection-hub
    import_name: connection_hub
    path: products/connection-hub/packages/connection-hub
    version: "2026.09.28.0307"
    version_source: products/connection-hub/packages/connection-hub/pyproject.toml
    workflow: .github/workflows/publish-python-package.yml
  cli_package:
    distribution: connection-hub-cli
    import_name: connection_hub_cli
    path: products/connection-hub/packages/connection-hub-cli
    version: "2026.09.28.0307"
    version_source: products/connection-hub/packages/connection-hub-cli/pyproject.toml
    workflow: .github/workflows/publish-python-package.yml

config:
  version: "2026.09.28.0307"
