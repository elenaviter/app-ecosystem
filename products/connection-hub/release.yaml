product:
  id: connection-hub
  ref: "2026.10.23.1100"
  description: |
    - connection-hub-cli 2026.10.23.1100, released on its own; the connection-hub package stays at 2026.10.19.2200. A secret set on a KDCube deployment works end to end from the CLI. When the calling Card lacks the secret resource, the Hub's admission answers `resource_not_consented` with a Card-grant consent (#875); the CLI opens it, waits for approval on the controlling terminal even when the value is piped in, and retries the same request (#876). It requires kdcube-cli>=2026.10.23.1100, whose management service and `ConsentRecovery` carry that consent (kdcube/kdcube#412). A token error's safe `error_description` is shown (#873). The README walks through setting a secret on a fresh machine, installing from PyPI.
  documentation: docs/connection-hub

components:
  kdcube_app:
    id: connection-hub@1-0
    path: products/connection-hub/apps/connection-hub@1-0
    release_record: products/connection-hub/apps/connection-hub@1-0/release.yaml
  python_package:
    distribution: connection-hub
    import_name: connection_hub
    path: products/connection-hub/packages/connection-hub
    version: "2026.10.19.2200"
    version_source: products/connection-hub/packages/connection-hub/pyproject.toml
    workflow: .github/workflows/publish-python-package.yml
  cli_package:
    distribution: connection-hub-cli
    import_name: connection_hub_cli
    path: products/connection-hub/packages/connection-hub-cli
    version: "2026.10.23.1100"
    version_source: products/connection-hub/packages/connection-hub-cli/pyproject.toml
    workflow: .github/workflows/publish-python-package.yml

config:
  version: "2026.10.23.1100"
