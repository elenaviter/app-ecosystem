product:
  id: connection-hub
  ref: "2026.09.23.0158"
  description: |
    Resident Card bearer custody now records prepared secret intent, atomic
    installation, rotation, retirement, and token-fenced cleanup obligations
    in PostgreSQL. Cleanup claims survive process restarts and Redis loss, and
    one row-then-reference lock order governs every credential transition.

    This snapshot also versions the Connection Hub host CLI as an explicit
    release component. The CLI consumes this exact Connection Hub family and
    the published KDCube CLI family used by its application-target operations,
    so a clean package-index install resolves one reviewed dependency chain.
  documentation: docs/connection-hub

components:
  kdcube_app:
    id: connection-hub@1-0
    path: products/connection-hub/apps/connection-hub@1-0
    release_record: products/connection-hub/apps/connection-hub@1-0/release.yaml
  python_package:
    distribution: connection-hub
    import_name: connection_hub
    path: products/connection-hub/packages/connection-hub
    version: "2026.09.23.0158"
    version_source: products/connection-hub/packages/connection-hub/pyproject.toml
    workflow: .github/workflows/publish-python-package.yml
  cli_package:
    distribution: connection-hub-cli
    import_name: connection_hub_cli
    path: products/connection-hub/packages/connection-hub-cli
    version: "2026.09.23.0158"
    version_source: products/connection-hub/packages/connection-hub-cli/pyproject.toml
    workflow: .github/workflows/publish-python-package.yml

config:
  version: "2026.09.23.0158"
