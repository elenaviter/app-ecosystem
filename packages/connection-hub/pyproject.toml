[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "connection-hub"
version = "0.0.1"
description = "One authority for delegated access: identity cards for agents and automations, per-call resolution at the service boundary. Placeholder release; the boundary/client SDK is being extracted."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Elena Viter" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 1 - Planning",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/elenaviter/app-ecosystem"
Repository = "https://github.com/elenaviter/app-ecosystem"

[tool.setuptools.packages.find]
where = ["src"]
