package:
  id: service-foundation
  ref: "2026.09.26.2220"
  description: |
    Released together with app-foundation, connection-hub and project-board at
    one version, so the Problem Board client installs from the package index
    as one dependency chain with no KDCube package (W322). No code change
    since 2026.09.22.2029; the version moves with the chain.

    2026.09.26.2205 has the same content and is on the package index. This
    version exists because connection-hub's publication at 2205 failed its CI
    tests, and the four packages are released at one version (PyPI versions
    are immutable).

components:
  python_package:
    id: service-foundation
    path: packages/service-foundation
    version: "2026.09.26.2220"
