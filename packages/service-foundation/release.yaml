package:
  id: service-foundation
  ref: "2026.10.03.0811"
  description: |
    - Attachments: a file the platform would refuse for its type and size (text over 10 MiB, SVG over 2 MiB) is refused when it is sent, not after it was queued. PDF and ZIP content is never held to the text or SVG ceiling.
    - Attachments: an upload the platform refuses permanently (413, 415, 422, or 400 with an attachment refusal code) is refused once and reported, instead of being retried. The error carries only the status, an allowlisted code and the platform's fixed reasons, never the response body. A response body of an unexpected shape no longer changes how the refusal is classified.
    - Host relay: the second, authoritative pending-mail read of a wake, and the hold writes after it, run in the channel's own store thread instead of on the shared event loop, so a slow mailbox no longer stalls every other channel.
    - Project journal: the local journal search index follows the worker's local checkout automatically, so a merge pulled into the clone is searchable without a manual reindex. The check runs in the background on its own worker, so a heartbeat never waits for Git or index work, and it never fetches. Search now reports a stale, partial or unavailable index explicitly instead of returning an empty result. Only the finished result's incident and record writes use the channel's store thread.

components:
  python_package:
    id: service-foundation
    path: packages/service-foundation
    version: "2026.10.03.0811"
