[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "service-foundation"
version = "0.0.1"
description = "Foundation for standalone runnable services: composition and launcher, browser and workload authentication surfaces, token issuance, configuration, health and readiness, migration invocation."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Elena Viter" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 1 - Planning",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/elenaviter/app-ecosystem"
Repository = "https://github.com/elenaviter/app-ecosystem"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
service_foundation = ["py.typed"]
