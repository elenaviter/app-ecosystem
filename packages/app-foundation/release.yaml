package:
  id: app-foundation
  ref: "2026.11.07.0535"
  description: |
    Changes since the previous pb release (#940). Source: App Ecosystem main ce5c51a8.

    - pb worker forget-card retires the local record of a Card that was revoked in Connection Hub and whose credential is gone, in one guarded command. pb status keeps working on a desktop whose keyring is locked or unavailable (W1012 point 6, #947).
    - Worker procedure revision 2026.11.07.1, covering #942 and #947 (#948). The Connect a machine steps check the store before any reset, and say that agents never reset it (W1012, #942).
    - Connection Hub: a hosted agent's consent is written on the agent's own Card, and the consent binds the provider account it may use (W1018, #945).
    - Connection Hub names its signing-secret slots, so an installer can create and verify them (W1019, #944).
    - Release tooling: after a publish, the release workflow waits until the new versions actually install. The Connection Hub CLI is versioned separately from the pb set (W1016, #941).
    - Tests: the forget-card stuck-store case skips when connection_hub_cli is not importable, which is the case in the release gate's per-package venv (#950).
    - Tests: the paired issuance expiry test uses a controlled database clock instead of a 1-second intent TTL and a sleep (W1023, #949).

components:
  python_package:
    id: app-foundation
    path: packages/app-foundation
    version: "2026.11.07.0535"
