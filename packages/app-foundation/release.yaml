package:
  id: app-foundation
  ref: "2026.11.06.1119"
  description: |
    Changes since 2026.10.25.0200 (tagged; PyPI's latest is 2026.10.25.100). Source: App Ecosystem main 7d914691.

    - pb status names the Connection Hub cause when a worker's Card is refused or cannot be attached, instead of asking to authorize again (W1013, #936). The board documentation describes how a returning agent's new Card is attached, with a warning against removing and re-adding the agent (#937).
    - The relay sends allow-listed resume details on worker.publish, so the board can show an agent's last known resume line (W1014, #938).
    - The add-a-worker-host procedure has steps for after a machine reboot and for a lost password store, including revoking the old Card and giving each agent a new one (W1012, #935).
    - Connection Hub decides hosted descriptor agent Cards in its own transactions (W1011, #933).
    - Connection Hub: approving an external client's consent demand adds the requested named-service operation to the Card's held selection instead of replacing it (#932). A refused named-service selection names each action and the grants it is missing (#926).
    - Staged uploads and Telegram media are bound to their authenticated owner; this requires a platform SDK with the owner-bound file-staging API (#931).
    - pb client: workspace and scratch listings and receipts print bounded brief output (counts and the newest records); JSON output is unchanged (#924).
    - Project Board contract and rules: the worker profile holds project.role.handover.decide, usable only by the knowledge-keeper role holder (W1007, #930); project.role.get documents its hand-over paging fields (W1005, #929).
    - Project Board documentation: low-disk alerts go to the owners of the machine's agents (W991, #923), and knowledge on the board (#927).
    - Tests and release tooling: the package suite is green on main (pinned history clocks, procedure revision 2026.10.26.1 recorded, and the release script resets the Hub record after a separate CLI release) (#925); the endpoint scan reads its input before host isolation (#928); the paired descriptor tests skip at collection when the platform SDK is absent, so the release gate runs without it (#939).

components:
  python_package:
    id: app-foundation
    path: packages/app-foundation
    version: "2026.11.06.1119"
