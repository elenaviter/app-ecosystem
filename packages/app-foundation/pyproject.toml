[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "app-foundation"
version = "2026.09.03.1835"
description = "Host-neutral MCP client and native credential-value primitives for applications."
readme = "README.md"
license = "MIT"
authors = [{ name = "Elena Viter" }]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
mcp = [
    "httpx2>=2.5,<3",
    "mcp==2.0.0",
]
native-secrets = [
    "keyring>=25,<26",
]
test = [
    "httpx2>=2.5,<3",
    "keyring>=25,<26",
    "mcp==2.0.0",
    "pytest>=8,<10",
    "pytest-asyncio>=0.23,<2",
    "uvicorn>=0.30,<1",
]

[project.urls]
Homepage = "https://github.com/elenaviter/app-ecosystem"
Repository = "https://github.com/elenaviter/app-ecosystem"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
app_foundation = ["py.typed"]
