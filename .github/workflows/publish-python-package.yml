name: Publish Python package

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package to publish
        required: true
        type: choice
        options:
          - connection-hub
          - connection-hub-cli
          - app-foundation
          - service-foundation
          - harness-foundation
          - capabilities-foundation
          - economics-foundation
          - project-board
          # The Problem Board client set, one after another in dependency
          # order; a failure stops the rest (W364, scripts/release-pb).
          - pb-set
      expected_version:
        description: Exact committed PEP 440 version
        required: true
        type: string

concurrency:
  group: publish-${{ inputs.package }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    # One package, or the pb set in dependency order. max-parallel 1 runs the
    # set one package at a time in the listed order, and fail-fast cancels the
    # rest when one fails, so a foundation failure never leaves project-board
    # published against it (the partial 2026.09.26.2205 set).
    strategy:
      max-parallel: 1
      fail-fast: true
      matrix:
        package: ${{ fromJSON(inputs.package == 'pb-set' && '["app-foundation","service-foundation","connection-hub","project-board"]' || format('["{0}"]', inputs.package)) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Resolve and verify package
        id: package
        env:
          PACKAGE_NAME: ${{ matrix.package }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          python -m pip install --upgrade pip packaging pyyaml
          python - "$GITHUB_OUTPUT" <<'PY'
          import os
          import sys
          import tomllib
          from pathlib import Path

          import yaml
          from packaging.version import InvalidVersion, Version

          packages = {
              "connection-hub": (
                  "products/connection-hub/packages/connection-hub",
                  "connection_hub",
                  "python_package",
              ),
              "connection-hub-cli": (
                  "products/connection-hub/packages/connection-hub-cli",
                  "connection_hub_cli",
                  "cli_package",
              ),
              "app-foundation": ("packages/app-foundation", "app_foundation", None),
              "service-foundation": ("packages/service-foundation", "service_foundation", None),
              "harness-foundation": ("packages/harness-foundation", "harness_foundation", None),
              "capabilities-foundation": ("packages/capabilities-foundation", "capabilities_foundation", None),
              "economics-foundation": ("packages/economics-foundation", "economics_foundation", None),
              "project-board": (
                  "products/project-board/packages/project-board",
                  "project_board",
                  None,
              ),
          }
          name = os.environ["PACKAGE_NAME"]
          expected = os.environ["EXPECTED_VERSION"].strip()
          try:
              Version(expected)
          except InvalidVersion as exc:
              raise SystemExit(f"expected_version is not PEP 440 compatible: {expected}") from exc
          path, import_name, release_component = packages[name]
          ref_type = os.environ.get("GITHUB_REF_TYPE", "")
          ref_name = os.environ.get("GITHUB_REF_NAME", "")
          if ref_type != "tag" or ref_name != expected:
              raise SystemExit(
                  "package publication must run from the exact release tag: "
                  f"expected tag {expected}, got {ref_type or '<none>'} "
                  f"{ref_name or '<none>'}"
              )
          metadata = tomllib.loads((Path(path) / "pyproject.toml").read_text())
          actual = str(metadata["project"]["version"])
          if actual != expected:
              raise SystemExit(
                  f"committed {name} version is {actual}, not requested {expected}"
              )
          if release_component is not None:
              release = yaml.safe_load(
                  Path("products/connection-hub/release.yaml").read_text()
              )
              release_values = {
                  "product.ref": release["product"]["ref"],
                  f"components.{release_component}.version": release["components"][
                      release_component
                  ]["version"],
                  "config.version": release["config"]["version"],
              }
              mismatches = {
                  field: value
                  for field, value in release_values.items()
                  if str(value) != expected
              }
              if mismatches:
                  raise SystemExit(
                      "Connection Hub release record does not match "
                      f"{expected}: {mismatches}"
                  )
              description = str(release["product"].get("description", "")).strip()
              if not description:
                  raise SystemExit(
                      "Connection Hub release record has no product.description"
                  )
          with open(sys.argv[1], "a", encoding="utf-8") as output:
              output.write(f"path={path}\n")
              output.write(f"import_name={import_name}\n")
              output.write(f"version={actual}\n")
          PY

      - name: Wait for first-party dependencies of this version on the index
        env:
          PACKAGE_NAME: ${{ matrix.package }}
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
          EXPECTED_VERSION: ${{ steps.package.outputs.version }}
        run: |
          # A package of the set depends on the others at this exact version.
          # The previous job published them; PyPI serves a new version on every
          # edge some minutes after upload. The file being downloadable is not
          # enough (run 42207266620, W1016): wait until the install the next
          # step runs resolves, several times in a row.
          tested=""
          if [ "$PACKAGE_NAME" = "connection-hub" ] || [ "$PACKAGE_NAME" = "connection-hub-cli" ] || [ "$PACKAGE_NAME" = "project-board" ]; then
            tested="--tested"
          fi
          python scripts/publish_wait.py --package-path "$PACKAGE_PATH" --expected-version "$EXPECTED_VERSION" $tested

      - name: Test package
        env:
          PACKAGE_NAME: ${{ matrix.package }}
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
          IMPORT_NAME: ${{ steps.package.outputs.import_name }}
          EXPECTED_VERSION: ${{ steps.package.outputs.version }}
        run: |
          if [ "$PACKAGE_NAME" = "connection-hub" ] || [ "$PACKAGE_NAME" = "connection-hub-cli" ] || [ "$PACKAGE_NAME" = "project-board" ]; then
            python -m pip install -e "${PACKAGE_PATH}[test]"
            python -m pytest "${PACKAGE_PATH}/tests"
          else
            python -m pip install -e "$PACKAGE_PATH"
          fi
          python - <<'PY'
          import importlib
          import os

          module = importlib.import_module(os.environ["IMPORT_NAME"])
          actual = getattr(module, "__version__", "")
          expected = os.environ["EXPECTED_VERSION"]
          if actual != expected:
              raise SystemExit(f"import version is {actual!r}, expected {expected!r}")
          PY

      - name: Build and inspect artifacts
        env:
          PACKAGE_PATH: ${{ steps.package.outputs.path }}
        run: |
          python -m pip install --upgrade build twine
          python -m build "$PACKAGE_PATH" --outdir dist
          python -m twine check dist/*

      - name: Smoke install wheel
        env:
          IMPORT_NAME: ${{ steps.package.outputs.import_name }}
          EXPECTED_VERSION: ${{ steps.package.outputs.version }}
        run: |
          python -m venv .release-smoke
          .release-smoke/bin/python -m pip install --upgrade pip
          .release-smoke/bin/python -m pip install dist/*.whl
          .release-smoke/bin/python - <<'PY'
          import importlib
          import os

          module = importlib.import_module(os.environ["IMPORT_NAME"])
          actual = getattr(module, "__version__", "")
          expected = os.environ["EXPECTED_VERSION"]
          if actual != expected:
              raise SystemExit(f"wheel version is {actual!r}, expected {expected!r}")
          PY

      - name: Preserve release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}-${{ steps.package.outputs.version }}
          path: dist/*

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
