[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "prokura-direct-admission-example"
version = "0.1.0"
description = "Reference protected backend using Prokura direct admission."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "prokura>=0.0.2,<0.1",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.23,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
